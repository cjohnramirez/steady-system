name: Preview

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  # This workflow pinned Node 18, which Next.js 16 does not support. 22 matches
  # what the project is developed against, and 20 is now being deprecated on
  # GitHub runners.
  #
  # pnpm's version is not set here on purpose. pnpm/action-setup reads it from
  # the `packageManager` field in package.json, so CI and local machines cannot
  # drift apart.
  NODE_VERSION: "22"

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      # The old step ran `pnpm format --check`, which expands to
      # `prettier --write . --check`. Those two flags conflict.
      - name: Prettier
        run: pnpm format:check

      - name: TypeScript
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

  migrations:
    name: Migrations apply to an empty database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts the full local stack and applies every migration followed by
      # seed.sql. This is what stops the schema in git drifting from the schema
      # that actually runs, which is how the database came to exist nowhere but
      # in a hosted project.
      - name: Apply migrations and seed
        run: |
          supabase start
          supabase db reset
