project_id = "gcs-system"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

# Applied in filename order by `supabase db reset` and `db push --include-seed`.
# Development data only. Never run these against production.
[db.seed]
enabled = true
sql_paths = ["./seeds/*.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Local mail catcher. Confirmation and password-reset mails land here instead of
# a real inbox; open the web UI to click through the links.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/confirm",
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Left off locally so seeded and freshly registered accounts can sign in without a
# round trip through the mail catcher. Turn this on for any deployed environment.
enable_confirmations = false
secure_password_change = true

# This is the entry that was missing in production in December 2025. Without it the
# custom_access_token_hook function exists but never runs, every access token comes
# back with no user_role claim, and middleware bounces every signed-in user out of
# every protected route.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[analytics]
enabled = false
